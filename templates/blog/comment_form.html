{% extends 'blog/base.html' %}
{% load crispy_forms_tags %}
{% block head_title %} 댓글 수정 {% endblock %}

{% block main_area %}

    <h1>댓글 수정</h1>
    <hr>
    <form method="post" id="comment-form">
        {% csrf_token %}
        {{ form | crispy }}
        <br/>
        <button class="btn btn-primary float-end">
            수정
        </button>
    </form>

{% endblock %}
